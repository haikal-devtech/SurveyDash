name: SurveyDash encrypted backup
on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveydash-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.SURVEYDASH_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test-only-password
          POSTGRES_DB: surveydash_restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: surveydash-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/surveydash-studio
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Encrypt a read-only source snapshot
        run: pnpm exec tsx scripts/backup.ts
        env:
          DATABASE_URL: ${{ secrets.SURVEYDASH_BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.SURVEYDASH_BACKUP_ENCRYPTION_KEY }}
      - name: Preserve encrypted recovery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surveydash-encrypted-${{ github.run_id }}
          path: surveydash-next/.data/backups/*.sdb.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Initialize isolated recovery database
        run: pnpm setup
        env:
          DATABASE_URL: postgres://postgres:restore-test-only-password@127.0.0.1:5432/surveydash_restore
          BETTER_AUTH_SECRET: recovery-test-only-secret-not-the-production-auth-key-000000
          BETTER_AUTH_URL: http://127.0.0.1:3100
      - name: Verify all restored rows and checksums
        run: pnpm exec tsx scripts/restore-staging.ts --latest
        env:
          DATABASE_URL: postgres://postgres:restore-test-only-password@127.0.0.1:5432/surveydash_restore
          ALLOW_STAGING_RESTORE: "true"
          BACKUP_ENCRYPTION_KEY: ${{ secrets.SURVEYDASH_BACKUP_ENCRYPTION_KEY }}
