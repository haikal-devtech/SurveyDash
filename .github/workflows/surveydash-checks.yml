name: SurveyDash checks
on:
  pull_request:
    paths: ["surveydash-next/**", ".github/workflows/surveydash-checks.yml"]
  push:
    branches: ["codex/surveydash-studio"]
    paths: ["surveydash-next/**", ".github/workflows/surveydash-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveydash-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: surveydash-next
    env:
      BETTER_AUTH_SECRET: ci-only-secret-for-isolated-surveydash-checks-000000000000
      BETTER_AUTH_URL: http://127.0.0.1:3100
      STUDIO_DB_PATH: .data/ci.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'codex/surveydash-studio' || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
